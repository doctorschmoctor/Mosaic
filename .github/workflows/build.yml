name: macOS build and tests
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # "Run workflow" on a branch publishes a release of it at the version in Resources/Info.plist,
  # tagging that commit v<version> first. "Republish" replaces an existing release of that
  # version with this commit (its notes, its files, and the tag moves here).
  workflow_dispatch:
    inputs:
      republish:
        description: "Replace the existing release of this version with this commit (moves its tag)"
        type: boolean
        default: false
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift toolchain
        run: swift --version
      - name: Test workspace and database reader
        run: ./scripts/test.sh
      - name: Build signed local app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mosaic-macOS
          path: build/Mosaic.zip
      - name: Render demo preview
        run: mkdir -p build/preview && ./scripts/render-preview.sh build/preview/workspace.png && .build/MosaicPreview build/preview/workspace-zoom-160.png --demo --zoom 1.6 && .build/MosaicPreview build/preview/workspace-zoom-80.png --demo --zoom 0.8
      - uses: actions/upload-artifact@v4
        with:
          name: Mosaic-preview
          path: build/preview/*.png

  # A version tag (v0.3.0), pushed or made here by "Run workflow", publishes a GitHub Release
  # with the disk image and the archive, from the same tested build. The tag must match the
  # version in Resources/Info.plist.
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Mosaic-macOS
          path: build
      # Run by hand on a commit that is already tagged at this version, the release is published
      # again (notes and files replaced); on an untagged commit, the tag is made first. A version
      # that was released from another commit is refused — raise the version — unless
      # "republish" was chosen, which moves the tag here and replaces that release.
      - name: Settle the version and its tag
        env:
          REPUBLISH: ${{ inputs.republish }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          TAG="v${VERSION}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
              TAGGED=$(git rev-parse "refs/tags/${TAG}^{commit}")
              if [ "${TAGGED}" != "${GITHUB_SHA}" ]; then
                [ "${REPUBLISH}" = "true" ] || { echo "Version ${VERSION} was released from ${TAGGED}, not this commit: raise CFBundleShortVersionString in Resources/Info.plist, or choose republish to replace that release with this commit" >&2; exit 1; }
                git tag -fa "${TAG}" -m "Mosaic ${VERSION}"
                git push --force origin "refs/tags/${TAG}"
              fi
            else
              git tag -a "${TAG}" -m "Mosaic ${VERSION}"
              git push origin "refs/tags/${TAG}"
            fi
          else
            [ "${GITHUB_REF_NAME}" = "${TAG}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match version ${VERSION} in Resources/Info.plist" >&2; exit 1; }
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
      - name: Make the disk image
        run: ./scripts/make-dmg.sh "build/Mosaic-${VERSION}.dmg" && cp build/Mosaic.zip "build/Mosaic-${VERSION}.zip"
      # What's new: docs/releases/<version>.md when it exists, else the commit subjects since the
      # previous release.
      - name: Write the release notes
        run: |
          {
            echo "## Install"
            echo
            echo "1. Download **Mosaic-${VERSION}.dmg** below and open it."
            echo "2. Drag **Mosaic** onto the **Applications** folder beside it."
            echo "3. Open Mosaic from Applications."
            echo
            echo "macOS will say it can't verify the app the first time, because this build is not notarized with Apple (it is signed locally). Allow it once:"
            echo
            echo "- **macOS 15 (Sequoia):** close the warning, open **System Settings › Privacy & Security**, scroll down and press **Open Anyway** next to Mosaic, then open it again."
            echo "- **macOS 14 (Sonoma):** right-click (or Control-click) Mosaic in Applications, choose **Open**, then **Open** in the dialog."
            echo
            echo "Then follow **Connect Messages** in the app (Full Disk Access, and the Automation prompt on your first send). Requires macOS 14 or later on Apple silicon."
            echo
            echo "Or with Homebrew: \`brew install --cask ${GITHUB_REPOSITORY_OWNER}/mosaic/mosaic\` (upgrade with \`brew upgrade --cask mosaic\`)."
            echo
            echo "## What's new in ${VERSION}"
            echo
            if [ -f "docs/releases/${VERSION}.md" ]; then
              cat "docs/releases/${VERSION}.md"
            else
              PREVIOUS=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)
              git log --no-merges --format='- %s' ${PREVIOUS:+${PREVIOUS}..}"${TAG}"
            fi
            echo
            if [ -n "${PREVIOUS:-}" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${TAG}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
            fi
          } > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "Mosaic ${VERSION}" --notes-file notes.md
            gh release upload "${TAG}" "build/Mosaic-${VERSION}.dmg" "build/Mosaic-${VERSION}.zip" --clobber
          else
            gh release create "${TAG}" "build/Mosaic-${VERSION}.dmg" "build/Mosaic-${VERSION}.zip" \
              --title "Mosaic ${VERSION}" --notes-file notes.md --verify-tag
          fi
      # The same release in Homebrew: the cask in <owner>/homebrew-mosaic points at this release's
      # disk image, by version and checksum. Needs the HOMEBREW_TAP_TOKEN secret (a token that can
      # write to that repository); without it the step says so and the release stands as is.
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the Homebrew tap was not updated"
            exit 0
          fi
          SHA256=$(shasum -a 256 "build/Mosaic-${VERSION}.dmg" | cut -d' ' -f1)
          TAP="${GITHUB_REPOSITORY_OWNER}/homebrew-mosaic"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Casks
          scripts/write-cask.sh "${VERSION}" "${SHA256}" > tap/Casks/mosaic.rb
          ruby -c tap/Casks/mosaic.rb
          if [ ! -f tap/README.md ]; then
            printf '# Mosaic for Homebrew\n\n```sh\nbrew install --cask %s/mosaic/mosaic\n```\n\nUpdated automatically by each [Mosaic release](https://github.com/%s/releases).\n' \
              "${GITHUB_REPOSITORY_OWNER}" "${GITHUB_REPOSITORY}" > tap/README.md
          fi
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "The tap already has Mosaic ${VERSION}"; exit 0; fi
          git commit -m "mosaic ${VERSION}"
          git push origin HEAD:main
