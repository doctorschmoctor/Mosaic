name: drag benchmark
on: [push]
jobs:
  bench:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Drag benchmark across commits
        run: ./scripts/bench/run.sh 614e48d "" nogeo nohover noid noshadow noeffect "nogeo+nohover+noid+noeffect"
