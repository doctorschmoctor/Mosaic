name: drag benchmark
on: [push]
jobs:
  bench:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Drag benchmark
        run: ./scripts/bench/run.sh 614e48d "" offset visual "visual+noeffect"
      - uses: actions/upload-artifact@v4
        with:
          name: drag-captures
          path: build/bench-*.png
