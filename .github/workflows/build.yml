name: drag benchmark
on: [push]
jobs:
  bench:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Drag benchmark, new drag
        run: ./scripts/bench/run.sh 8fa39c8 ""
      - name: Drag benchmark, before
        run: ./scripts/bench/run.sh 614e48d ""
      - uses: actions/upload-artifact@v4
        with:
          name: drag-captures
          path: build/bench-*.png
